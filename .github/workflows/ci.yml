name: CI

on:
  push:
    branches: [main]
  pull_request:

# The CKEditor Studio bundle is checked in its own repository
# (Simply007/ckeditor-studio-bundle) and installed from Packagist.
jobs:
  php:
    name: PHP and Composer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish
      - name: Lint PHP
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check shell scripts
        run: bash -n bin/demo-preflight
